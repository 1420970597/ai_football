model:
  provider: custom:cline
  default: ${HERMES_MODEL}
  supports_vision: true

providers:
  cline:
    api: ${HERMES_PROVIDER_BASE_URL}
    key_env: HERMES_PROVIDER_API_KEY
    transport: chat_completions

agent:
  max_turns: 128
  image_input_mode: native
  disabled_toolsets:
    - web
    - search
    - terminal
    - file
    - browser
    - image_gen
    - tts
    - todo
    - memory
    - session_search
    - cronjob
    - code_execution
    - delegation
    - messaging
    - debugging

skills:
  external_dirs:
    - /workspace/skills

tools:
  tool_search:
    enabled: "off"

# A complete 60-quote response is ~48–60K characters before the MCP JSON
# envelope. The default 50K spill threshold hides it behind a file that this
# deliberately restricted agent cannot read. Keep the existing finite 100K
# per-result / 200K per-turn framework limits; do not grant filesystem tools.
tool_budget:
  mcp_result_size_chars: 100000

platform_toolsets:
  api_server:
    - expert-skills
    - mcp-football

mcp_servers:
  football:
    url: http://hermes-mcp:8090/mcp
    headers:
      Authorization: "Bearer ${EXPERT_MCP_TOKEN}"
    tools:
      resources: false
      prompts: false
      include:
        - search_matches
        - resolve_match
        - list_match_markets
        - record_expert_signals
