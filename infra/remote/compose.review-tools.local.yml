# Overlay on the existing local project; public ports and old tunnels unchanged.
services:
  hermes-mcp:
    environment:
      PLATFORM_INTERNAL_API: http://review-db-link:18094/internal/mcp
    depends_on:
      review-db-link: {condition: service_healthy}
  review-db-link:
    image: ${REMOTE_TUNNEL_IMAGE:?Pin verified storage tunnel image by digest}
    entrypoint: [python, /deployment/review_link.py]
    volumes:
      - {type: bind, source: ./infra/remote/review_link.py, target: /deployment/review_link.py, read_only: true, bind: {create_host_path: false}}
      - {type: bind, source: ./.runtime/tunnel/ssh_config, target: /run/storage/ssh_config, read_only: true, bind: {create_host_path: false}}
      - {type: bind, source: ./.runtime/tunnel/id_ed25519, target: /run/storage/id_ed25519, read_only: true, bind: {create_host_path: false}}
      - {type: bind, source: ./.runtime/tunnel/known_hosts, target: /run/storage/known_hosts, read_only: true, bind: {create_host_path: false}}
      - {type: bind, source: ./.runtime/review-tools/link.json, target: /run/review-tools/link.json, read_only: true, bind: {create_host_path: false}}
    healthcheck:
      test: [CMD, python, /deployment/review_link.py, --health]
      interval: 15s
      timeout: 4s
      retries: 3
      start_period: 15s
    networks: [app-private, egress]
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ['/tmp:rw,noexec,nosuid,nodev,size=16m']
    cpus: .05
    mem_limit: 64m
    pids_limit: 16
    logging: {driver: json-file, options: {max-size: 10m, max-file: '3'}}
