name: ai-football-expert-iteration
services:
  supervisor:
    image: ${EXPERT_MONITOR_IMAGE:?set an exact built monitor image ID}
    pull_policy: never
    container_name: ai-football-expert-iteration-supervisor
    restart: unless-stopped
    init: true
    read_only: true
    user: "0:0"
    cpus: 0.5
    mem_limit: 768m
    pids_limit: 192
    stop_grace_period: 30s
    environment:
      EXPERT_PROJECT_ROOT: ${EXPERT_PROJECT_ROOT:?set project root absolute path}
      EXPERT_SOURCE_ROOT: ${EXPERT_SOURCE_ROOT:?set authoritative source tree absolute path}
      EXPERT_ITERATION_STATE_DIR: ${EXPERT_ITERATION_STATE_DIR:?set project private runtime directory}
      EXPERT_ITERATION_FIRST_START: ${EXPERT_ITERATION_FIRST_START:-2026-11-12T13:00:00Z}
      EXPERT_ITERATION_TIMEOUT_SECONDS: "600"
      EXPERT_REPAIR_TIMEOUT_SECONDS: "600"
      EXPERT_ITERATION_RETRY_SECONDS: "300"
      CODEX_HOME: /run/expert-codex-home
      PYTHONDONTWRITEBYTECODE: "1"
      GIT_AUTHOR_NAME: Project Automation
      GIT_AUTHOR_EMAIL: automation@localhost
      GIT_COMMITTER_NAME: Project Automation
      GIT_COMMITTER_EMAIL: automation@localhost
    volumes:
      # Keep the same absolute project path so linked-worktree .git pointers work.
      - type: bind
        source: ${EXPERT_PROJECT_ROOT:?set project root absolute path}
        target: ${EXPERT_PROJECT_ROOT:?set project root absolute path}
      - type: bind
        source: ${EXPERT_CODEX_NATIVE:?set existing native codex binary path}
        target: /usr/local/bin/codex
        read_only: true
      - type: bind
        source: ${EXPERT_CODEX_CODE_MODE_HOST:?set existing native code-mode-host sibling path}
        target: /usr/local/bin/codex-code-mode-host
        read_only: true
      - type: bind
        source: ${EXPERT_COMPOSE_PLUGIN:-/usr/libexec/docker/cli-plugins/docker-compose}
        target: /usr/libexec/docker/cli-plugins/docker-compose
        read_only: true
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
      - type: bind
        source: ${EXPERT_AGENT_AUTH_FILE:?set protected project auth file}
        target: /run/expert-codex-home/auth.json
        read_only: true
      - type: bind
        source: ${EXPERT_AGENT_CONFIG_FILE:?set minimal project provider config}
        target: /run/expert-codex-home/config.toml
        read_only: true
    tmpfs:
      - /tmp:rw,nosuid,size=128m,mode=1777
      - /run/expert-codex-home:rw,nosuid,size=128m,mode=0700
    logging:
      driver: json-file
      options:
        max-size: "2m"
        max-file: "3"
    healthcheck:
      test: [CMD, python, /opt/expert-monitor/expert_iteration_supervisor.py, --health]
      interval: 60s
      timeout: 5s
      retries: 2
