name: ai-football-config-probe
services:
  value-probe:
    image: python:3.12-slim
    network_mode: none
    read_only: true
    cpus: 0.25
    mem_limit: 128m
    environment:
      TEST_VALUE: ${S3_SECRET_KEY:?Fake fixture required}
    command:
      - python
      - -c
      - |
        import os
        expected = "fixture$$with spaces'and\\slash\""
        assert os.environ["TEST_VALUE"] == expected, "Compose changed fake fixture characters"
        print("Compose fixture characters preserved in container environment.")
