name: ai-football-web-integration
x-api-environment: &api-environment
  DATABASE_URL: postgresql://web_integration:test-only-database-password@pg:5432/web_integration
  APP_SESSION_SECRET: 000102030405060708090a0b0c0d0e0f101112131415161718191a1b1c1d1e1f
  DATA_ENCRYPTION_KEY: 1f1e1d1c1b1a191817161514131211100f0e0d0c0b0a09080706050403020100
  EXPERT_MCP_TOKEN: integration-mcp-no-real-provider
  COLLECTOR_INTERNAL_TOKEN: integration-collector-no-real-provider
  EXECUTOR_INTERNAL_TOKEN: integration-executor-disabled
  COOKIE_SECURE: 'false'
  LIVE_ORDERS_ENABLED: 'false'
  HERMES_API_URL: http://unconfigured-hermes:8642/v1
  TELEGRAM_CONTROL_URL: http://unconfigured-telegram:8092
  QUOTE_MAX_AGE_SECONDS: 3600
  BOOTSTRAP_ADMIN_EMAIL: admin@web-integration.invalid
  BOOTSTRAP_ADMIN_PASSWORD: test-only-admin-password-1234
  BOOTSTRAP_ADMIN_TOTP_SECRET: JBSWY3DPEHPK3PXP
services:
  pg:
    image: postgres:16-alpine@sha256:f4610795587492cd4fb887c2dc3de301b813278bb6f616992061141b5f15ac36
    environment:
      POSTGRES_USER: web_integration
      POSTGRES_PASSWORD: test-only-database-password
      POSTGRES_DB: web_integration
    tmpfs:
      - /var/lib/postgresql/data:rw,size=256m
    healthcheck:
      test: [CMD-SHELL, pg_isready -U web_integration -d web_integration]
      interval: 1s
      timeout: 2s
      retries: 30
    cpus: .25
    mem_limit: 256m
    networks: [isolated]
  seed:
    image: ai-football-api:web-integration-current
    build:
      context: ../..
      dockerfile: services/api/Dockerfile
    environment: *api-environment
    command: [sh, -c, 'python -m app.migrate && python /verification/seed.py']
    volumes:
      - ./seed.py:/verification/seed.py:ro
    depends_on:
      pg: {condition: service_healthy}
    cpus: .5
    mem_limit: 256m
    networks: [isolated]
  api:
    image: ai-football-api:web-integration-current
    environment: *api-environment
    command: [uvicorn, app.main:app, --host, 0.0.0.0, --port, '8080', --workers, '1']
    depends_on:
      seed: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/readyz',timeout=2)"]
      interval: 2s
      timeout: 3s
      retries: 20
    cpus: .5
    mem_limit: 384m
    networks: [isolated]
  web:
    image: ai-football-web:web-integration-current
    build:
      context: ../..
      dockerfile: web/app/Dockerfile
    depends_on:
      api: {condition: service_healthy}
    cpus: .25
    mem_limit: 128m
    networks: [isolated]
  browser:
    image: ai-football-browser:v2.0.0-dev
    command: [tests/browser/integration.mjs]
    volumes:
      - ../..:/work
    depends_on:
      web: {condition: service_started}
    cpus: .75
    mem_limit: 1g
    pids_limit: 256
    networks: [isolated]
networks:
  isolated:
    internal: true
