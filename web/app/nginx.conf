limit_req_zone $binary_remote_addr zone=platform_api:10m rate=30r/s;
limit_req_status 429;
log_format platform_safe '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent $request_time';

server {
    access_log /var/log/nginx/access.log platform_safe;
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    client_max_body_size 1m;
    client_header_timeout 10s;
    client_body_timeout 15s;
    keepalive_timeout 30s;
    send_timeout 30s;

    location = /api/v1/admin/hermes-connection {
        if ($request_method !~ ^(GET|PUT)$) { return 405; }
        gzip off;
        limit_req zone=platform_api burst=15 nodelay;
        client_max_body_size 8k;
        client_body_buffer_size 16k;
        auth_request /_hermes_connection_auth;
        auth_request_set $hermes_token $upstream_http_x_hermes_connection_token;
        auth_request_set $hermes_actor $upstream_http_x_hermes_connection_actor;
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $hermes_admin hermes-connection:8642;
        proxy_pass http://$hermes_admin/project/connection;
        proxy_pass_request_headers off;
        proxy_set_header Content-Type application/json;
        proxy_set_header X-Hermes-Connection-Token $hermes_token;
        proxy_set_header X-Hermes-Connection-Actor $hermes_actor;
        proxy_set_header X-Request-ID $request_id;
        proxy_connect_timeout 2s;
        proxy_read_timeout 18s;
        add_header Cache-Control "private, no-store" always;
    }

    location = /_hermes_connection_auth {
        internal;
        proxy_pass http://api:8080/internal/hermes-connection/authorize;
        proxy_method $request_method;
        proxy_pass_request_body off;
        proxy_pass_request_headers off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-CSRF-Token $http_x_csrf_token;
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
    }

    location /api/ {
        limit_req zone=platform_api burst=60 nodelay;
        proxy_pass http://api:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_connect_timeout 2s;
        proxy_send_timeout 15s;
        proxy_read_timeout 35s;
    }

    location ^~ /internal/ { return 404; }
    location ^~ /mcp/ { return 404; }
    location ^~ /hermes/ { return 404; }

    location /healthz {
        proxy_pass http://api:8080/healthz;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        add_header X-Frame-Options DENY always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob:; connect-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header Cache-Control "no-cache" always;
    }

    location /assets/ {
        try_files $uri =404;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "public, max-age=300" always;
    }
}
