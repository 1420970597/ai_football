limit_req_zone $binary_remote_addr zone=platform_api:10m rate=30r/s;
limit_req_status 429;
log_format platform_safe '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent $request_time';

server {
    access_log /var/log/nginx/access.log platform_safe;
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    client_max_body_size 1m;
    client_header_timeout 10s;
    client_body_timeout 15s;
    keepalive_timeout 30s;
    send_timeout 30s;

    # 宿主反代只压缩 text/html；脚本、样式与公开 JSON 在这里压缩。
    # 含登录态的 /api/ 响应保持不压缩，避免把会话相关内容暴露给压缩侧信道。
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml;

    location /api/v1/public/ {
        limit_req zone=platform_api burst=60 nodelay;
        proxy_pass http://api:8080/api/v1/public/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_connect_timeout 2s;
        proxy_send_timeout 15s;
        proxy_read_timeout 35s;
    }

    location /api/ {
        gzip off;
        limit_req zone=platform_api burst=60 nodelay;
        proxy_pass http://api:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_connect_timeout 2s;
        proxy_send_timeout 15s;
        proxy_read_timeout 35s;
    }

    location ^~ /internal/ { return 404; }
    location ^~ /mcp/ { return 404; }
    location ^~ /hermes/ { return 404; }

    location /healthz {
        gzip off;
        proxy_pass http://api:8080/healthz;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        add_header X-Frame-Options DENY always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob:; connect-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header Cache-Control "no-cache" always;
    }

    location /assets/ {
        try_files $uri =404;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "public, max-age=300" always;
    }
}
