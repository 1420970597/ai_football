<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>足球研究 · 实时工作台</title>
<link rel="stylesheet" href="/workbench.css">
<script defer src="/workbench.js"></script>
</head>
<body>
<header class="topbar">
  <a class="brand" href="#live" aria-label="足球研究工作台"><span class="brandmark">◉</span><span>足球研究<small>LIVE MATCH LAB</small></span></a>
  <nav aria-label="主要导航"><button id="nav-live" class="nav active" aria-current="page">滚球工作台</button><button id="nav-history" class="nav">战绩</button></nav>
  <div id="connection" class="connection"><i></i><span>正在连接</span></div>
</header>
<main>
  <section id="live-view">
    <div class="page-heading"><div><span class="eyebrow">LIVE</span><h1>实时滚球</h1></div><button id="refresh" class="button">↻ 刷新</button></div>
    <div class="overview" aria-live="polite"><div><span>当前赛事</span><strong id="match-count">—</strong></div><div><span>数据源赛事</span><strong id="source-match-count">—</strong></div><div><span>已订阅</span><strong id="subscribed-count">—</strong></div><div><span>报价新鲜度</span><strong id="quote-freshness">—</strong></div><div><span>算法 P95</span><strong id="algorithm-latency">—</strong></div></div>
    <div id="notice" class="notice" role="status" hidden></div>
    <div class="toolbar"><label class="search"><span>⌕</span><input id="search" type="search" placeholder="搜索球队或联赛" aria-label="搜索球队或联赛"></label><div class="tabs" aria-label="比赛类型"><button data-type="real" class="active">真实足球</button><button data-type="virtual">虚拟 / EAFC</button><button data-type="all">全部</button></div></div>
    <div class="workspace"><aside class="league-panel"><div class="panel-label">联赛</div><button id="all-leagues" class="league active">全部联赛 <span id="league-total">0</span></button><div id="leagues"></div></aside><section class="match-panel" aria-label="比赛列表"><div class="list-heading"><h2 id="list-title">实时赛事</h2><span id="list-count">正在读取</span></div><div id="matches" aria-live="polite"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></div></section><aside id="detail" class="detail-panel" aria-label="赛事分析详情"><div class="detail-placeholder"><span class="placeholder-icon">◎</span><h2>选择比赛</h2></div></aside></div>
  </section>
  <section id="history-view" hidden><div class="page-heading"><div><span class="eyebrow">HISTORY</span><h1>战绩</h1></div><button id="history-refresh" class="button">↻ 刷新</button></div><div id="history-notice" class="notice" role="status" hidden></div><div id="history-stats" class="overview"></div><div class="history-controls"><label>时间范围 <select id="history-days"><option value="0">全部历史</option><option value="7">近7天</option><option value="30">近30天</option></select></label><label>比赛类型 <select id="history-type"><option value="real">真实足球</option><option value="virtual">虚拟 / EAFC</option><option value="all">全部历史</option></select></label></div><div class="history-card"><div class="list-heading"><h2>决策与赛果</h2><span id="history-count">正在读取</span></div><div class="table-scroll"><table><thead><tr><th>建议时间</th><th>比赛 / 方向</th><th>入场赔率</th><th>实际比分</th><th>结算</th><th>净收益</th></tr></thead><tbody id="history-rows"></tbody></table></div><div id="history-empty" class="empty" hidden><h3>尚无已确认的建议战绩</h3><p>模型观察与正式建议分开记录，未确认赛果不会被补成 0:0。</p></div></div></section>
</main>
</body>
</html>
