name: Publish development candidate

on:
  workflow_dispatch:
  push:
    tags: [v2.0.0-dev]

permissions:
  contents: read

concurrency:
  group: development-release
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/verify.yml
  publish:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    permissions:
      contents: write
      packages: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Build clean-source development APKs
        run: bash android/build-candidate.sh
      - name: Build and push source-bound project images
        run: |
          set -eu
          mkdir -p .runtime/release
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          for component in api collector executor mcp web storage-tunnel; do
            case "$component" in
              api) recipe=services/api/Dockerfile ;;
              collector) recipe=services/collector/Dockerfile ;;
              executor) recipe=services/executor/Dockerfile ;;
              mcp) recipe=services/hermes-mcp/Dockerfile ;;
              web) recipe=web/app/Dockerfile ;;
              storage-tunnel) recipe=infra/tunnel/Dockerfile ;;
            esac
            reference="ghcr.io/1420970597/ai-football-$component:2.0.0-dev-$GITHUB_SHA"
            docker build -f "$recipe" --label "org.opencontainers.image.revision=$GITHUB_SHA" \
              --label org.opencontainers.image.version=2.0.0-dev -t "$reference" .
            docker push "$reference"
            docker pull "$reference"
            digest=$(docker image inspect "$reference" --format '{{index .RepoDigests 0}}')
            printf '%s %s\n' "$component" "$digest" >> .runtime/release/image-digests.txt
          done
          docker logout ghcr.io
      - name: Validate immutable release provenance
        run: |
          docker run --rm --cpus=.5 --memory=256m --network none -v "$PWD:/work" -w /work \
            python:3.12-slim@sha256:a6e34c598f2467ed0e9a8d349809fcd8b5c603269512df273a0bb1784edc11b1 \
            python -c 'import json,pathlib; p=pathlib.Path(".runtime/release"); rows=[line.split() for line in (p/"image-digests.txt").read_text().splitlines()]; (p/"images.json").write_text(json.dumps(dict(rows)))'
          docker run --rm --cpus=.5 --memory=256m --network none -v "$PWD:/work" -w /work \
            python:3.12-slim@sha256:a6e34c598f2467ed0e9a8d349809fcd8b5c603269512df273a0bb1784edc11b1 \
            python infra/release/manifest.py --commit "$GITHUB_SHA" --images .runtime/release/images.json \
              --artifacts android/build/artifacts --output .runtime/release/release-manifest.json
      - name: Create explicitly non-production GitHub prerelease
        run: |
          gh release create v2.0.0-dev --target "$GITHUB_SHA" --prerelease \
            --title 'v2.0.0-dev · 开发候选，尚未生产验收' \
            --notes-file docs/platform-v2/DEVELOPMENT_RELEASE.md \
            .runtime/release/release-manifest.json \
            android/build/artifacts/ballnews-2.0.0-dev-debug.apk \
            android/build/artifacts/ballnews-2.0.0-dev-unsigned.apk \
            android/build/artifacts/package-verification.txt
