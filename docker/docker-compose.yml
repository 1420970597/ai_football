version: '3.8'

services:
  # Redis缓存服务
  redis:
    image: redis:7-alpine
    container_name: ai_football_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    networks:
      - ai_football_network

  # 浏览器抓取服务
  browser-scraper:
    build:
      context: ..
      dockerfile: docker/Dockerfile.browser
    container_name: ai_football_browser_scraper
    ports:
      - "8080:8080"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DISPLAY=:99
      - CHROME_ARGS=--no-sandbox,--disable-dev-shm-usage,--disable-gpu,--remote-debugging-port=9222
    volumes:
      - ../output:/home/scraper/app/output
      - /tmp/.X11-unix:/tmp/.X11-unix
    depends_on:
      - redis
    networks:
      - ai_football_network
    security_opt:
      - seccomp:unconfined
    shm_size: 2gb
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.0'

  # AI分析主服务
  ai-analyzer:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: ai_football_analyzer
    ports:
      - "8000:8000"
    environment:
      - BROWSER_SCRAPER_URL=http://browser-scraper:8080
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ../output:/app/output
      - ../config.py:/app/config.py
    depends_on:
      - redis
      - browser-scraper
    networks:
      - ai_football_network

volumes:
  redis_data:

networks:
  ai_football_network:
    driver: bridge