# 注意：不再声明 `version:`。Compose V2 已忽略该字段并会输出
#       "the attribute `version` is obsolete" 警告。

name: ai_football

services:
  # Redis缓存服务
  redis:
    image: redis:7-alpine
    container_name: ai_football_redis
    ports:
      # 端口可通过环境变量覆盖，避免与宿主机上其他项目冲突：
      #   REDIS_PORT=16379 docker compose -f docker/docker-compose.yml up -d
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    networks:
      - ai_football_network

  # 浏览器抓取服务
  browser-scraper:
    build:
      context: ..
      dockerfile: docker/Dockerfile.browser
    container_name: ai_football_browser_scraper
    ports:
      # 同理可覆盖： SCRAPER_PORT=18080 docker compose ... up -d
      - "${SCRAPER_PORT:-8080}:8080"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DISPLAY=:99
      - CHROME_ARGS=--no-sandbox,--disable-dev-shm-usage,--disable-gpu,--remote-debugging-port=9222
    volumes:
      - ../output:/home/scraper/app/output
      - /tmp/.X11-unix:/tmp/.X11-unix
    depends_on:
      - redis
    networks:
      - ai_football_network
    security_opt:
      - seccomp:unconfined
    shm_size: 2gb
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.0'
    # 显式声明启动命令。默认 CMD 已是同一命令，此处显式写出以便排查时无需翻 Dockerfile。
    # 注意：browser_scraper_service.py 的逻辑是「当 DISPLAY 存在时启用 --headless」，
    #       故上面的 DISPLAY=:99 实际是触发无头模式的开关（见 README「已知问题」）。
    command: ["python3", "browser_scraper_service.py"]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8080/health', timeout=5).status==200 else 1)"]
      interval: 15s
      timeout: 8s
      retries: 5
      start_period: 40s

  # AI分析主服务
  ai-analyzer:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: ai_football_analyzer
    ports:
      - "${ANALYZER_PORT:-8000}:8000"
    environment:
      - BROWSER_SCRAPER_URL=http://browser-scraper:8080
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ../output:/app/output
      - ../config.py:/app/config.py:ro
    depends_on:
      - redis
      - browser-scraper
    networks:
      - ai_football_network
    # 默认不随 up 启动（分析器为一次性任务，而非长驻服务）。
    # 需要时用： docker compose -f docker/docker-compose.yml run --rm ai-analyzer
    profiles: ["analyzer"]

  # B/S 架构的 Server 端入口：REST API + 静态控制台
  analytics-api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.analytics
    container_name: ai_football_analytics_api
    ports:
      # 可覆盖： ANALYTICS_PORT=18000 docker compose ... up -d
      - "${ANALYTICS_PORT:-8000}:8000"
    environment:
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - SNAPSHOT_ROOT=/app/output/snapshots
      - CORPUS_ROOT=${CORPUS_ROOT:-}
      # 数据源：默认 leyu（乐鱼）。切回体彩文件源用 DATA_SOURCE=ticai。
      - DATA_SOURCE=${DATA_SOURCE:-leyu}
      # 乐鱼网关与会话。
      # 会话必须由部署时注入，**不得硬编码进仓库**（AGENTS.md §3.4）。
      # 三种来源（优先级：命令 → 文件 → 环境变量）：
      #   LEYU_LOGIN_COMMAND  登录命令（argv 形式，不是 shell 字符串），
      #                       stdout 输出会话 JSON → 支持自动续期（推荐）
      #   LEYU_SESSION_FILE   会话 JSON 文件，可由外部流程定期刷新
      #   LEYU_REQUEST_ID     手工临时使用的会话令牌
      - LEYU_HOST=${LEYU_HOST:-https://api.rah492x.com}
      - LEYU_REQUEST_ID=${LEYU_REQUEST_ID:-}
      - LEYU_CUID=${LEYU_CUID:-}
      - LEYU_SESSION_FILE=${LEYU_SESSION_FILE:-}
      - LEYU_LOGIN_COMMAND=${LEYU_LOGIN_COMMAND:-}
      # 留空表示在线拉取；给出 saz 路径则转为离线回放（供无网环境）
      - LEYU_SAZ=${LEYU_SAZ:-}
      # 缓存后端：redis 可达则用 redis，否则自动回退内存
      - REDIS_URL=redis://redis:6379/0
    volumes:
      # 宿主机语料（output/场次*.json）只读挂载，供首次导入与体彩源使用
      - ../output:/app/output
      # 乐鱼抓包（离线回放时才需要；文件缺失不影响在线模式）
      - ../leyu.saz:/app/leyu.saz:ro
    depends_on:
      - redis
    networks:
      - ai_football_network
    restart: unless-stopped

  # Web 控制台静态资源（B/S 的 B）。
  # 用 nginx 托管 static，并把 /api 反向代理到 analytics-api，
  # 从而让 Browser 端与 Server 端同源 —— 免除 CORS 配置。
  web-console:
    image: nginx:1.27-alpine
    container_name: ai_football_web_console
    ports:
      # 可覆盖： CONSOLE_PORT=13000 docker compose ... up -d
      - "${CONSOLE_PORT:-3000}:80"
    volumes:
      - ../web/console:/usr/share/nginx/html:ro
      - ./nginx.console.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - analytics-api
    networks:
      - ai_football_network
    restart: unless-stopped

volumes:
  redis_data:

networks:
  ai_football_network:
    driver: bridge