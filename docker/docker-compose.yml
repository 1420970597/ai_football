# 注意：不再声明 `version:`。Compose V2 已忽略该字段并会输出
#       "the attribute `version` is obsolete" 警告。

# ---------------------------------------------------------------------------
# CPU 预算：本机同时运行 LLM 网关，编译/采集打满 CPU 会拖垮网关（进而
# 打断交互会话）。因此**所有容器**都声明 `cpus`，默认 2.0 核
# （4 vCPU 的 50%）。覆盖： AI_FOOTBALL_CPUS=3.0 docker compose ...
#
# ⚠️ `cpus` 只约束**运行期**。构建期用的是 BuildKit，它**忽略**
#    `--cgroup-parent`（实测 cpu.max 仍为 max，4 核跑满）。构建请走
#    `scripts/cpu-limited.sh build`，它用 DOCKER_BUILDKIT=0 + cpuset
#    真正把构建容器钉在 2 个核上（实测 affinity=[0,1]）。
# ---------------------------------------------------------------------------

name: ai_football

services:
  # Redis缓存服务
  redis:
    image: redis:7-alpine
    container_name: ai_football_redis
    ports:
      # 端口可通过环境变量覆盖，避免与宿主机上其他项目冲突：
      #   REDIS_PORT=16379 docker compose -f docker/docker-compose.yml up -d
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 20s
      timeout: 3s
      retries: 3
      start_period: 5s
    # CPU 硬上限（见文件头「CPU 预算」）。cpus = 核数，与宿主机核数无关。
    cpus: "${AI_FOOTBALL_CPUS:-2.0}"
    networks:
      - ai_football_network

  # 说明：本项目已收敛为**单一数据源（乐鱼在线 API）+ 单服务**架构。
  #   历史遗留的 browser-scraper（Selenium 沙盒）与 ai-analyzer（多站点
  #   文章搜索 + LLM 摘要）两个容器已于本次清理中移除：数据源、采集、
  #   归一化、分析与决策全部由下面的 analytics-api 一个进程承担。
  #   被移除的替代路径：collector/leyu_*（乐鱼 HTTP/WS 采集）与
  #   service/analysis.py（决策编排），不再需要浏览器与抓取客户端。

  # B/S 架构的 Server 端入口：REST API + 静态控制台
  analytics-api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.analytics
    container_name: ai_football_analytics_api
    # SIGTERM stops producers and fsyncs queued history before container exit.
    stop_grace_period: 60s
    ports:
      # 可覆盖： ANALYTICS_PORT=18000 docker compose ... up -d
      - "${ANALYTICS_PORT:-8000}:8000"
    # 从仓库根的 .env 注入（该文件已被 .gitignore 忽略，凭证不入库）。
    # 注意：compose 的 ${VAR} 插值默认只在「项目目录」(docker/) 找 .env，
    # 而本项目把 .env 放在仓库根，故此处显式用 env_file 注入容器，
    # 并把它标记为可选（required: false），缺文件时不报错。
    env_file:
      - path: ../.env
        required: false
    environment:
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - SNAPSHOT_ROOT=/app/output/snapshots
      # 缓存后端：redis 可达则用 redis，否则自动回退内存
      - REDIS_URL=redis://redis:6379/0
      - S3_CONFIG_FILE=/app/client/credentials.json
    # ⚠️ 可外部注入的变量（DATA_SOURCE、LEYU_*）一律**只经上面的 env_file** 传入，
    #    不写进 environment。原因：compose 中 environment 优先级高于 env_file，
    #    写成 `- FOO=${FOO:-}` 时，未在 shell 设置就会被展开为空串并覆盖 .env，
    #    导致 .env 配置静默失效（本项目曾真实踩到该坑）。
    #    缺省行为由代码兜底（数据源默认 leyu；网关默认 api.rah492x.com）。
    #
    # 可写入仓库根 .env（已被 .gitignore 忽略，凭证不入库）的变量：
        #   LEYU_H5_SITE / LEYU_H5_TOKEN / LEYU_H5_UUID / LEYU_H5_SIGNATURE
    #       H5 cookie 引导（**推荐**，与浏览器操作一致）：
    #       带 cookie 取网关 → launch 换 requestId；可自动重取
    #   LEYU_APP_TOKEN / LEYU_APP_UUID / LEYU_APP_SIGNATURE
    #       App 引导（等价写法，凭据放请求头而非 cookie）
    #   LEYU_REQUEST_ID / LEYU_CUID      手工临时会话
    #   LEYU_SESSION_FILE                会话 JSON 文件（外部定期刷新）
    #   LEYU_LOGIN_COMMAND               登录命令（argv 形式，非 shell 字符串）
    #   LEYU_HOST / LEYU_APP_HOST        覆盖网关
    #   LEYU_SAZ                         给出 saz 路径则离线回放
    #   ANALYSIS_CYCLE                   后台定时决策间隔秒（默认 180；0=关闭）
    #   ANALYSIS_CYCLE_LIMIT             每轮决策赛事数（默认 20）
    #   ANALYSIS_CYCLE_LIVE_ONLY         1=只对进行中赛事决策（省 LLM）
    #   ANALYSIS_RESULT_PATH             决策结果落盘路径（重启可恢复）
    volumes:
      # 宿主机快照存储（乐鱼实时采集写入）
      - ../output:/app/output
      - ../client:/app/client:ro
      # 乐鱼抓包（离线回放时才需要；文件缺失不影响在线模式）
      - ../leyu.saz:/app/leyu.saz:ro
    depends_on:
      - redis
    # 决策/采集是 CPU 敏感路径（全量采集时会打满多核）。
    # 限到 cpus 核，避免抢占同机上 LLM 网关的算力。
    cpus: "${AI_FOOTBALL_CPUS:-2.0}"
    networks:
      - ai_football_network
    restart: unless-stopped

  # Web 控制台静态资源（B/S 的 B）。
  # 用 nginx 托管 static，并把 /api 反向代理到 analytics-api，
  # 从而让 Browser 端与 Server 端同源 —— 免除 CORS 配置。
  model-worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.model
    container_name: ai_football_model_worker
    environment:
      - MODEL_LEDGER_ROOT=/app/output/ledger
    volumes:
      - ../output:/app/output
    cpus: "${MODEL_WORKER_CPUS:-2.0}"
    mem_limit: "${MODEL_WORKER_MEMORY:-5g}"
    stop_grace_period: 60s
    restart: unless-stopped
    network_mode: none
    healthcheck:
      test: ["CMD", "python", "-c", "import json,time,datetime; from pathlib import Path; d=json.loads(Path('/app/output/models/dashboard.json').read_text()); assert d['running'] and time.time()-datetime.datetime.fromisoformat(d['heartbeat_at']).timestamp()<90"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 60s

  archive-worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.archive
    container_name: ai_football_archive_worker
    environment:
      - S3_CONFIG_FILE=/app/client/credentials.json
    volumes:
      - ../output:/app/output
      - ../client:/app/client:ro
    cpus: "${ARCHIVE_WORKER_CPUS:-0.5}"
    mem_limit: 512m
    stop_grace_period: 60s
    restart: unless-stopped
    networks:
      - ai_football_network

  web-console:
    image: nginx:1.27-alpine
    container_name: ai_football_web_console
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 20s
      timeout: 3s
      retries: 3
      start_period: 5s
    ports:
      # 可覆盖： CONSOLE_PORT=13000 docker compose ... up -d
      # 本机 3000 为 Grafana 使用，控制台沿用 3003。
      - "${CONSOLE_PORT:-3003}:80"
    volumes:
      - ../web/console:/usr/share/nginx/html:ro
      - ./nginx.console.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - analytics-api
    # nginx 静态托管几乎不吃 CPU，但统一限上，防止异常流量下的突发。
    cpus: "${AI_FOOTBALL_CPUS:-2.0}"
    networks:
      - ai_football_network
    restart: unless-stopped

volumes:
  redis_data:

networks:
  ai_football_network:
    driver: bridge
