# 注意：不再声明 `version:`。Compose V2 已忽略该字段并会输出
#       "the attribute `version` is obsolete" 警告。

name: ai_football

services:
  # Redis缓存服务
  redis:
    image: redis:7-alpine
    container_name: ai_football_redis
    ports:
      # 端口可通过环境变量覆盖，避免与宿主机上其他项目冲突：
      #   REDIS_PORT=16379 docker compose -f docker/docker-compose.yml up -d
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    networks:
      - ai_football_network

  # 浏览器抓取服务
  browser-scraper:
    build:
      context: ..
      dockerfile: docker/Dockerfile.browser
    container_name: ai_football_browser_scraper
    ports:
      # 同理可覆盖： SCRAPER_PORT=18080 docker compose ... up -d
      - "${SCRAPER_PORT:-8080}:8080"
    # ⚠️ 重要：不要把「希望由 .env 覆盖」的变量写进 environment。
    #    compose 中 environment 的优先级**高于** env_file，若写成
    #    `- FOO=${FOO:-}`，未设置时会被展开为空串并覆盖 env_file 的值，
    #    导致 .env 里的配置静默失效（本项目曾真实踩到该坑）。
    #    因此这里只保留容器内固定值；所有可外部注入的变量（DATA_SOURCE、
    #    LEYU_*）一律只经 env_file 传入，缺省行为由代码兜底
    #    （data source 默认 leyu；网关默认 api.rah492x.com）。
    environment:
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - SNAPSHOT_ROOT=/app/output/snapshots
      - CORPUS_ROOT=${CORPUS_ROOT:-}
      # 缓存后端：redis 可达则用 redis，否则自动回退内存
      - REDIS_URL=redis://redis:6379/0
    # 以下变量可写入仓库根的 .env（已被 .gitignore 忽略，凭证不入库）：
    #   DATA_SOURCE=leyu|ticai            数据源（缺省 leyu）
    #   LEYU_APP_TOKEN / LEYU_APP_UUID / LEYU_APP_SIGNATURE
    #       App 引导（推荐）：启动 YBTY 场馆换取 requestId，可自动续期
    #   LEYU_REQUEST_ID / LEYU_CUID       手工临时会话
    #   LEYU_SESSION_FILE                 会话 JSON 文件（外部定期刷新）
    #   LEYU_LOGIN_COMMAND                登录命令（argv，非 shell 字符串）
    #   LEYU_HOST / LEYU_APP_HOST         覆盖网关
    #   LEYU_SAZ                          给出 saz 路径则离线回放
    volumes:
      - ../output:/home/scraper/app/output
      - /tmp/.X11-unix:/tmp/.X11-unix
    depends_on:
      - redis
    networks:
      - ai_football_network
    security_opt:
      - seccomp:unconfined
    shm_size: 2gb
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.0'
    # 显式声明启动命令。默认 CMD 已是同一命令，此处显式写出以便排查时无需翻 Dockerfile。
    # 注意：browser_scraper_service.py 的逻辑是「当 DISPLAY 存在时启用 --headless」，
    #       故上面的 DISPLAY=:99 实际是触发无头模式的开关（见 README「已知问题」）。
    command: ["python3", "browser_scraper_service.py"]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8080/health', timeout=5).status==200 else 1)"]
      interval: 15s
      timeout: 8s
      retries: 5
      start_period: 40s

  # AI分析主服务
  ai-analyzer:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: ai_football_analyzer
    ports:
      - "${ANALYZER_PORT:-8000}:8000"
    environment:
      - BROWSER_SCRAPER_URL=http://browser-scraper:8080
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ../output:/app/output
      - ../config.py:/app/config.py:ro
    depends_on:
      - redis
      - browser-scraper
    networks:
      - ai_football_network
    # 默认不随 up 启动（分析器为一次性任务，而非长驻服务）。
    # 需要时用： docker compose -f docker/docker-compose.yml run --rm ai-analyzer
    profiles: ["analyzer"]

  # B/S 架构的 Server 端入口：REST API + 静态控制台
  analytics-api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.analytics
    container_name: ai_football_analytics_api
    ports:
      # 可覆盖： ANALYTICS_PORT=18000 docker compose ... up -d
      - "${ANALYTICS_PORT:-8000}:8000"
    # 从仓库根的 .env 注入（该文件已被 .gitignore 忽略，凭证不入库）。
    # 注意：compose 的 ${VAR} 插值默认只在「项目目录」(docker/) 找 .env，
    # 而本项目把 .env 放在仓库根，故此处显式用 env_file 注入容器，
    # 并把它标记为可选（required: false），缺文件时不报错。
    env_file:
      - path: ../.env
        required: false
    environment:
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - SNAPSHOT_ROOT=/app/output/snapshots
      - CORPUS_ROOT=${CORPUS_ROOT:-}
      # 缓存后端：redis 可达则用 redis，否则自动回退内存
      - REDIS_URL=redis://redis:6379/0
    # ⚠️ 可外部注入的变量（DATA_SOURCE、LEYU_*）一律**只经上面的 env_file** 传入，
    #    不写进 environment。原因：compose 中 environment 优先级高于 env_file，
    #    写成 `- FOO=${FOO:-}` 时，未在 shell 设置就会被展开为空串并覆盖 .env，
    #    导致 .env 配置静默失效（本项目曾真实踩到该坑）。
    #    缺省行为由代码兜底（数据源默认 leyu；网关默认 api.rah492x.com）。
    #
    # 可写入仓库根 .env（已被 .gitignore 忽略，凭证不入库）的变量：
    #   DATA_SOURCE=leyu|ticai           数据源（缺省 leyu）
    #   LEYU_APP_TOKEN / LEYU_APP_UUID / LEYU_APP_SIGNATURE
    #       App 引导（推荐）：启动 YBTY 场馆换取 requestId，可自动续期
    #   LEYU_REQUEST_ID / LEYU_CUID      手工临时会话
    #   LEYU_SESSION_FILE                会话 JSON 文件（外部定期刷新）
    #   LEYU_LOGIN_COMMAND               登录命令（argv 形式，非 shell 字符串）
    #   LEYU_HOST / LEYU_APP_HOST        覆盖网关
    #   LEYU_SAZ                         给出 saz 路径则离线回放
    #   ANALYSIS_CYCLE                   后台定时决策间隔秒（默认 180；0=关闭）
    #   ANALYSIS_CYCLE_LIMIT             每轮决策赛事数（默认 20）
    #   ANALYSIS_CYCLE_LIVE_ONLY         1=只对进行中赛事决策（省 LLM）
    #   ANALYSIS_RESULT_PATH             决策结果落盘路径（重启可恢复）
    volumes:
      # 宿主机语料（output/场次*.json）只读挂载，供首次导入与体彩源使用
      - ../output:/app/output
      # 乐鱼抓包（离线回放时才需要；文件缺失不影响在线模式）
      - ../leyu.saz:/app/leyu.saz:ro
    depends_on:
      - redis
    networks:
      - ai_football_network
    restart: unless-stopped

  # Web 控制台静态资源（B/S 的 B）。
  # 用 nginx 托管 static，并把 /api 反向代理到 analytics-api，
  # 从而让 Browser 端与 Server 端同源 —— 免除 CORS 配置。
  web-console:
    image: nginx:1.27-alpine
    container_name: ai_football_web_console
    ports:
      # 可覆盖： CONSOLE_PORT=13000 docker compose ... up -d
      - "${CONSOLE_PORT:-3000}:80"
    volumes:
      - ../web/console:/usr/share/nginx/html:ro
      - ./nginx.console.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - analytics-api
    networks:
      - ai_football_network
    restart: unless-stopped

volumes:
  redis_data:

networks:
  ai_football_network:
    driver: bridge