# web-console 的 nginx 配置
#
# 作用：把 Browser 端静态资源与 Server 端 API 放在**同一源**上，
# 从而免除 CORS 配置，也让前端可以直接用相对路径 /api/v1/... 调用。
#
#   Browser  →  http://localhost:3000/          （静态 index.html）
#   Browser  →  http://localhost:3000/api/v1/x  →  反代至 analytics-api:8000
#   Browser  →  http://localhost:3000/health    →  同样反代

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 决策缓存包含逐场盘口明细，可达数十 MB。按客户端能力压缩文本，
    # 缩短远程首屏等待；无 gzip 客户端仍收到相同的原始内容。
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 4;
    gzip_min_length 1024;
    gzip_types application/json application/javascript text/css;

    # 安全响应头（控制台为纯静态 + 同源 API）
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # 静态资源：HTML 不缓存（便于迭代），其余短缓存
    location = /index.html {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 反向代理
    location /api/ {
        proxy_pass         http://analytics-api:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        # 决策接口要调用 LLM（推理型模型单场 10~25s），
        # 默认 60s 与 120s 都会让 /decisions 变成 504。
        proxy_read_timeout    300s;
        proxy_send_timeout    300s;
    }

    # 健康检查直通（前端「校准报告」页会调用 /health）
    location = /health {
        proxy_pass         http://analytics-api:8000/health;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
    }

    # nginx 自身的存活探针
    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
